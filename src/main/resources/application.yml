spring:
  application:
    name: Prysm
  main:
    web-application-type: none

prysm:
  agentic:
    enabled: ${PRYSM_AGENTIC_ENABLED:true}
    max-iterations: ${PRYSM_AGENTIC_MAX_ITERATIONS:12}
    max-tool-calls: ${PRYSM_AGENTIC_MAX_TOOL_CALLS:30}
    max-token-budget: ${PRYSM_AGENTIC_MAX_TOKEN_BUDGET:131072}
    tool-timeout-seconds: ${PRYSM_AGENTIC_TOOL_TIMEOUT_SECONDS:20}
    tool-max-attempts: ${PRYSM_AGENTIC_TOOL_MAX_ATTEMPTS:3}
    tool-threads: ${PRYSM_AGENTIC_TOOL_THREADS:8}
    judge-enabled: ${PRYSM_AGENTIC_JUDGE_ENABLED:false}
  review:
    mode: ${PRYSM_REVIEW_MODE:full}
    repository-root: ${PRYSM_WORKSPACE_ROOT:${user.dir}}
    window-lines: 20
    max-snippets-per-file: 3
    max-file-context-chars: 8000
    max-total-context-chars: 40000
    max-file-size-bytes: 1048576
    enrichment:
      max-body-chars: 4000
      max-commits: 5
      max-commit-message-chars: 300
    gate:
      min-reviewable-files: 1
      min-prompt-chars: 200
  llm:
    enabled: true
    api-base-url: ${LLM_API_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${LLM_MODEL:qwen-plus}
    timeout-seconds: 60
  optimization:
    rollout-percent: ${PRYSM_OPT_ROLLOUT_PERCENT:0}
    group: ${PRYSM_OPT_GROUP:combined}
    max-output-tokens:
      enabled: ${PRYSM_OPT_MAX_OUTPUT_TOKENS_ENABLED:true}
      value: ${PRYSM_LLM_MAX_OUTPUT_TOKENS:800}
    fast-path:
      enabled: ${PRYSM_OPT_FAST_PATH_ENABLED:true}
      mode: ${PRYSM_OPT_FAST_PATH_MODE:fast_model}
      fast-model: ${PRYSM_LLM_FAST_MODEL:qwen-turbo}
    compact-prompt:
      enabled: ${PRYSM_OPT_COMPACT_PROMPT_ENABLED:true}
  comment:
    enabled: true
